[package]
name = "shallgraph-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bindings for shallgraph-core (wasm-bindgen JSON ABI, Node target for VS Code)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
shallgraph-core = { workspace = true, features = ["source-links"] }
wasm-bindgen.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
