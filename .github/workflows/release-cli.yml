# GRD-CLI-007: Publish CLI install artifacts to GitHub Releases for direct npm install from source URLs.
# workflow_dispatch runs the same packaging and uploads workflow artifacts (no GitHub Release).
name: Release CLI artifacts
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli-artifacts:
    name: Build and upload CLI tarballs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package CLI artifacts
        run: bash ./scripts/package.sh

      # GRD-DEVOPS-003: tag must be v${version} and tarball names must include that version.
      - name: Assert tag and CLI artifact names
        if: github.event_name == 'release'
        run: python3 ./scripts/assert-release-tag.py "${{ github.event.release.tag_name }}" cli

      - name: Upload CLI tarballs to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tgz_files=(release/*.tgz)
          if [ ${#tgz_files[@]} -eq 0 ]; then
            echo "ERROR: No .tgz artifacts found in release/."
            exit 1
          fi
          gh release upload "${{ github.event.release.tag_name }}" "${tgz_files[@]}" --clobber

      - name: Upload CLI tarballs as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cli-tarballs
          path: release/*.tgz
          if-no-files-found: error

  native-cli-binary:
    # GRD-CLI-009: Publish a native gitreqd CLI binary for Linux x86_64 as a GitHub Release asset.
    name: Build and upload Linux x86_64 CLI binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.83.0
      - name: Package native CLI binary
        run: bash ./scripts/package-native-cli.sh
      # GRD-DEVOPS-003: tag must match the shared package version.
      - name: Assert tag and native CLI binary
        if: github.event_name == 'release'
        run: python3 ./scripts/assert-release-tag.py "${{ github.event.release.tag_name }}" native
      - name: Upload native CLI binary to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset="release/gitreqd-linux-x86_64"
          if [ ! -f "${asset}" ]; then
            echo "ERROR: Native CLI binary not found: ${asset}"
            exit 1
          fi
          gh release upload "${{ github.event.release.tag_name }}" "${asset}" --clobber
      - name: Upload native CLI binary as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gitreqd-linux-x86_64
          path: release/gitreqd-linux-x86_64
          if-no-files-found: error
