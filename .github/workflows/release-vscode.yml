# GRD-DEVOPS-002: Build VSCode extension and attach the .vsix to the GitHub Release.
# GRD-VSC-008: Publish that same versioned VSIX to the Visual Studio Marketplace.
name: Release VSCode extension
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  vsix:
    name: Package, upload, and publish VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.83.0
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli
        run: bash ./scripts/install-wasm-bindgen.sh
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Package VSCode extension
        run: npm run package -w shallgraph-vscode
      # GRD-DEVOPS-003: tag must be v${version} and the VSIX filename must include that version.
      - name: Assert tag and VSIX filename
        run: python3 ./scripts/assert-release-tag.py "${{ github.event.release.tag_name }}" vscode
      - name: Upload VSIX to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in packages/vscode/*.vsix; do
            gh release upload "${{ github.event.release.tag_name }}" "$f" --clobber
          done
      # GRD-VSC-008: publish the version-asserted VSIX to the Visual Studio Marketplace.
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash ./scripts/publish-vscode-marketplace.sh
