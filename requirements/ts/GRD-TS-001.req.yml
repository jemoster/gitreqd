id: GRD-TS-001
title: TypeScript core library API
require: The TypeScript implementation shall expose a programmatic library API for project discovery, requirement loading, validation, and link resolution.
refinement: |
  The VSCode extension and the TypeScript CLI shall use this library so TypeScript in-process consumers share one engine.

  This requirement applies only to the TypeScript implementation. A command-line implementation in another language is not required to expose this API.
attributes:
  rationale: |
    The VSCode extension runs in-process with TypeScript and needs a library API. That constraint must not leak into the essential CLI contract used by a future Rust application.
  status: active
links:
  - satisfies: GRD-SYS-002
