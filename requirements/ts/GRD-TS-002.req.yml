id: GRD-TS-002
title: TypeScript Zod encoding of the requirement schema
require: The TypeScript implementation shall encode the requirement YAML schema in Zod and derive exported JSON Schema from that encoding.
refinement: |
  Zod is the TypeScript-language encoding of the canonical schema defined by GRD-SYS-009, not a requirement on other implementations.
attributes:
  rationale: |
    Keeping Zod as a TypeScript implementation detail allows a Rust CLI to validate and export the same schema without a JavaScript runtime.
  status: active
links:
  - satisfies: GRD-SYS-009
