id: GRD-UI-005
title: Loaded revision label and optional remote snapshot refresh in the browser shell
description: |
  When the requirements list API (or equivalent bootstrap load used by the browser) returns loaded revision metadata—at minimum a branch name and a Git commit object id (oid) identifying the tree the server loaded—the browser UI shall display that branch name in the persistent status area beside or adjacent to the requirement count and validation summary already defined in GRD-UI-001.

  The commit identifier shown in the UI shall be exactly the first seven hexadecimal characters of that oid (short hash). The full oid shall not be displayed in the UI, including in titles or tooltips that would expose the complete hash.

  When the host integrates an optional refresh callback (meaning invoked after the user explicitly requests reloading the remote snapshot before the client reloads requirements so revision metadata can update), the browser UI shall expose an unmistakable refresh affordance (for example a refresh icon button). Activating it shall await that callback according to the host contract, then reload requirements so that branch name and short commit identifier reflect whatever metadata the server returns next.

  When no such callback is supplied, revision metadata shall still be displayed whenever the API provides it; no refresh control need be shown for that case.

  This requirement applies to any deployment that uses the shared browser UI components; remote-backed hosts supply metadata and optional callbacks; purely local filesystem-backed deployments may omit loaded revision metadata from responses without violating this requirement.
attributes:
  status: active
  rationale: |
    A short commit prefix matches common Git tooling and keeps the status strip readable. An explicit refresh control lets hosts invalidate remote caches or reload from upstream without leaving the browser. Keeping full oids out of the visible UI avoids leaking lengthy hashes while still identifying the loaded revision.
links:
  - satisfies: GRD-UI-001
  - satisfies: GRD-UI-004
