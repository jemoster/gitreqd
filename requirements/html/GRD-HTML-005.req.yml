id: GRD-HTML-005
title: Parameters in table format
require: When a requirement defines a `parameters` map, the HTML report (and any export that displays parameters) shall render those parameters in a table.
refinement: The table shall show parameter name and value so the user can scan them at a glance.
attributes:
  rationale: |
    A table layout provides clear alignment of names and values and scales better when a requirement has many parameters.
  status: active
  applicability: essential-cli
links:
  - satisfies: GRD-HTML-001
