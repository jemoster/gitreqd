id: GRD-HTML-007
title: Source links in the HTML report
require: The HTML report shall present the source-link records associated with each requirement.
refinement: |
  This consumer reads source-link records as defined by GRD-SYS-017. It does not define how records are produced.

  For each requirement, include the records whose `requirement_id` matches that requirement:

  - Records with kind `implements` appear under **Implemented by**.
  - Records with kind `verifies` appear under **Verified by**.

  Each presented record identifies the source using `path`, `item`, and `linespace`. Omit a section when that requirement has no records of the corresponding kind.

  How records are collected, and which producers exist, is out of scope for this requirement.
attributes:
  rationale: The HTML report should show where a requirement is implemented and verified whenever source-link records exist, without depending on a particular producer.
  status: active
satisfied_by:
  - artifact: crates/gitreqd-core/src/html.rs
    description: Renders source-link records under Implemented by and Verified by.
  - artifact: crates/gitreqd/src/html.rs
    description: Passes collected source-link records into HTML generation.
verified_by:
  - artifact: crates/gitreqd-core/src/html.rs
    description: Unit tests cover kind headings, omitted empty sections, line ranges, and combined verified-by lists.
  - artifact: crates/gitreqd/tests/cli.rs
    description: CLI HTML generation includes Implemented by and Verified by for tagged Rust sources.
links:
  - satisfies: GRD-HTML-001
  - satisfies: GRD-SYS-017
