id: GRD-GIT-002
title: No merge-conflict resolution for requirement files
require: The tool shall not provide merge-conflict resolution for requirement files.
refinement: |
  The product shall not reconstruct ours and theirs versions of a requirement file from conflict markers.

  The product shall not merge differing `title`, `require`, `refinement`, or `rationale` fields, including via an LLM.

  The product shall not expose a command that writes resolved requirement YAML after a merge conflict.

  This withdraws the previous LLM-backed resolve-conflicts capability.
attributes:
  rationale: |
    The merge-conflict resolution feature has seen little use. Removing it reduces product surface area and drops the need for LLM-backed merge behavior.
  status: active
