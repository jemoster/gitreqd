id: GRD-VSC-004
title: YAML schema for requirement files
require: The VSCode extension shall include a schema for the YAML format of the requirement files.
refinement: The schema shall enable editor support such as validation, completion, and documentation for requirement file structure (e.g. id, title, require, refinement, attributes, links).
attributes:
  rationale: |
    A schema improves editing experience with validation and hints while authoring requirement YAML.
  status: active
  applicability: vscode
links:
  - satisfies: GRD-VSC-001
