id: GRD-DEVOPS-003
title: Align package versions with the GitHub release tag
require: The core, VS Code, and Cargo workspace packages shall share one version that matches the GitHub release tag and the names of the packaged artifacts.
refinement: |
  The shared version is the `version` field of `@gitreqd/core` and `gitreqd-vscode`. The VS Code dependency on `@gitreqd/core` shall use that same version.

  When a Rust workspace is present, `[workspace.package] version` shall match the shared version.

  The GitHub release tag shall be `v` followed by that version (for example tag `v1.2.3` for version `1.2.3`). Packed npm tarball, VSIX, and native CLI artifact names shall include that version where the filename is versioned (for example `gitreqd-core-1.2.3.tgz`, `gitreqd-vscode-1.2.3.vsix`). The Linux x86_64 native CLI binary artifact is `gitreqd-linux-x86_64`.
attributes:
  rationale: |
    When package versions, git tags, and artifact names diverge, users cannot tell which release they installed and VS Code may not replace a prior extension install.
  status: active
satisfied_by:
  - artifact: scripts/bump-version.py
    description: Sets the shared version across workspace packages, lockfiles, and README install URLs.
  - artifact: scripts/assert-release-tag.py
    description: Fails a release job when the tag or packed artifact names do not match the shared version.
  - artifact: .github/workflows/release-cli.yml
    description: Release jobs assert the tag and core tarball / native CLI artifact names before upload.
  - artifact: .github/workflows/release-vscode.yml
    description: Release job asserts the tag and VSIX filename before upload.
  - artifact: release.md
    description: Exclusive maintainer guide for bumping, tagging, and publishing a release.
verified_by:
  - artifact: packages/core/test/release-version-consistency.test.ts
    description: Checks lockstep versions, bump-script behavior, and release workflow assertions.
