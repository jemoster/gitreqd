id: GRD-CLI-009
title: Publish native CLI binary as GitHub Release asset
require: The project distribution shall publish a native gitreqd CLI binary for {{ GRD-SYS-008:native_binary_os }} {{ GRD-SYS-008:native_binary_arch }} as a GitHub Release asset.
attributes:
  rationale: Users who prefer a native executable need a versioned Linux 64-bit binary so they can install the CLI without npm.
  status: active
links:
  - satisfies: GRD-SYS-008
satisfied_by:
  - artifact: scripts/package-native-cli.sh
    description: Builds the Linux x86_64 gitreqd binary into release/gitreqd-linux-x86_64.
  - artifact: .github/workflows/release-cli.yml
    description: Release job uploads the native Linux x86_64 CLI binary as a GitHub Release asset.
verified_by:
  - artifact: packages/core/test/release-native-cli-artifacts.test.ts
    description: Asserts the packaging script, release workflow, and release guide cover the native binary asset.
