id: GRD-CLI-005
title: CLI schema command
require: The CLI shall provide a `schema` command that writes the effective requirement schema for the current project to standard output or to a path given by the user.
refinement: |
  The command name shall be `schema`.

  The command shall use the same project root discovery as other essential CLI commands (from the current directory or `--project-dir`). If no project root is found, the command shall fail with a diagnostic on standard error.

  When the schema is composed from project configuration (see GRD-SYS-009), the output shall reflect that project’s effective schema.

  The `--format` option shall select the output representation. Supported values shall include `json-schema` (the default) and `yaml` (the same schema document serialized as YAML).

  When `-o` / `--output <file>` is given, the command shall write the schema to that file. Otherwise it shall write the schema to standard output.
attributes:
  rationale: |
    Teams need to feed the schema into editors, CI, or documentation tools without relying on ad hoc scripts; a first-class CLI option keeps the behavior aligned with the project and usable from any essential CLI implementation.
  status: active
links:
  - satisfies: GRD-CLI-008
  - satisfies: GRD-CLI-003
  - satisfies: GRD-SYS-009
