id: GRD-CLI-008
title: Essential command-line interface
require: The product shall provide a command-line interface whose essential commands are bootstrap, validate, html, and schema.
refinement: |
  Additional commands may exist in a given implementation; they are specified by other requirements and are not required of an implementation of the essential CLI.

  The essential CLI is specified independently of programming language.
attributes:
  rationale: A language-independent essential command set allows the same CLI functions to be implemented in more than one language.
  status: active
links:
  - satisfies: GRD-SYS-002
