id: GRD-SYS-012
title: No external LLM provider configuration
require: The tool shall not configure external LLM providers in the project root marker file `{{ GRD-SYS-007:root_marker_filename }}`.
refinement: |
  The project root marker shall not define an `llm` configuration block for selecting a provider or connection settings.

  Features shall not read LLM provider configuration from `{{ GRD-SYS-007:root_marker_filename }}`.

  This withdraws the previous requirement that LLM-backed features load provider settings from the root marker.
attributes:
  rationale: |
    LLM provider configuration existed to support merge-conflict resolution, which is being removed. Unused provider configuration should not remain in the product.
  status: active
