id: GRD-SYS-014
title: No Ollama LLM provider
require: The tool shall not support `ollama` as an LLM provider.
refinement: |
  The product shall not accept `ollama` as a named provider, shall not require an Ollama model name in project config, and shall not call an Ollama server.

  This withdraws the previous Ollama provider configuration defined under GRD-SYS-012.
attributes:
  rationale: |
    Ollama provider support existed for LLM-backed features that are being removed. Unused local-LLM configuration should not remain in the product.
  status: active
links:
  - satisfies: GRD-SYS-012
