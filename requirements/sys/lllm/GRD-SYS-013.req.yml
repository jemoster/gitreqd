id: GRD-SYS-013
title: No Claude API provider
require: The tool shall not support `claude` as an LLM provider.
refinement: |
  The product shall not accept `claude` as a named provider, shall not read an API key from an environment variable named in project config, and shall not send Claude API requests.

  This withdraws the previous Claude provider configuration defined under GRD-SYS-012.
attributes:
  rationale: |
    Claude provider support existed for LLM-backed features that are being removed. Keeping an unused provider increases configuration and secret-handling complexity without benefit.
  status: active
links:
  - satisfies: GRD-SYS-012
