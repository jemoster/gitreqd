id: GRD-SYS-008
title: Build and package for distribution
require: A script shall build and package the tool for distribution.
refinement: |
  The packaged artifact shall support installation onto a host system.

  Once installed, the tool shall be usable from various repositories running on that host (e.g. via a globally available command or PATH-installed binary).

  Native CLI binaries produced for distribution shall target {{ :native_binary_os }} {{ :native_binary_arch }}. Other operating systems and architectures are not required native-binary targets.
attributes:
  rationale: |
    Users need a single, repeatable way to obtain an installable artifact and install the tool on a machine so that multiple repositories can use the same installation without building from source per repo.
  status: active
parameters:
  native_binary_os: Linux
  native_binary_arch: x86_64
