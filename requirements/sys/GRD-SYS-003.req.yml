id: GRD-SYS-003
title: Project root and discovery
require: The project root shall be identified by a marker {{ GRD-SYS-007:root_marker_filename }} and requirements discovered under configured directories.
refinement: |
  Discovery uses the pattern `**/*{{ GRD-SYS-007:requirement_file_extension }}` under each configured requirement directory.
attributes:
  rationale: |
    Enables the tool to work in any repo that opts in by adding the marker
    and to ignore requirements outside the project.
  status: active
  applicability: essential-cli
links:
  - satisfies: GRD-SYS-002
